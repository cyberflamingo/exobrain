name: "Publish"
on:
  # Run only when pushing to main branch
  push:
    branches:
      - main

# Read-only by default. The job below asks for more, by name, with a reason.
permissions:
  contents: read

# Deploys are not cancelled mid-push: a half-finished push to gh-pages is worse than waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emanote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the built site to the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The old sridca/emanote:latest on Docker Hub is a broken stub (a 2 KB layer whose command points
      # at a Nix store path that is not in the image), so the build failed with "exec: not found".
      # This is the maintained image, pinned by digest. Its entrypoint is already `emanote`, so the
      # arguments start at --layers.
      - name: Build emanote site 🔧
        run: |
          mkdir -p output.docker
          docker run \
            -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            --tmpfs /tmp \
            -v "$PWD:/data" \
            ghcr.io/srid/emanote:1.4.0.0@sha256:17489aac00b847a0c98256ec93cafa17cd244414ad8ef3514bd81f1c35e8ab2d \
            --layers "/data/.deploy/github;/data/content" gen /data/output.docker
          cp -r output.docker output  # Ditch docker created root-owned files
      - name: Deploy to gh-pages 🚀
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output/
          cname: zettel.cyberflamingo.net
